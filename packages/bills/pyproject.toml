[project]
name = "bills"
version = "0.1.0"
description = "Load bills into data pipeline."
readme = "README.md"
authors = [
    { name = "Austin Smith", email = "austindsmith_accounts@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "onepassword-sdk>=0.4.1",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
